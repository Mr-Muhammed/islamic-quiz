<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة السيرة النبوية - إعداد محمد عنتر</title>
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <!-- Dark Mode Toggle -->
        <div class="form-check form-switch d-flex justify-content-start mb-4">
            <input class="form-check-input" type="checkbox" id="darkModeToggle">
            <label class="form-check-label ms-2" for="darkModeToggle">الوضع الليلي</label>
        </div>

        <!-- Quiz Intro -->
        <div id="intro" class="text-center">
            <h1 class="mb-4">مسابقة السيرة النبوية</h1>
            <h1 class="mb-4">المالك: <a href="https://www.facebook.com/0MohammedBenAntar/">محمد عنتر</a></h1>
            <h2 class="mb-4">المسابقة عبارة عن 6 أسئلة. الإسئلة عبارة عن خيارات, ومدة الجواب على السؤال 30 ثانية. إن لم تجاوب خلال ثلاثون ثانية: سيتم نقلك تلقائيًا إلى السؤال الذي يليه.</h2>
            <h2 class="mb-4">لن يرى أحد إجاباتك. بعد إغلاق هذه الصفحة "سيتم محو كل شيء".</h2>

            <div class="mb-3">
                <label for="username" class="form-label">اسم المشارك:</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <button id="startQuiz" class="btn btn-primary">ابدأ المسابقة</button>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="d-none">
            <div class="d-flex justify-content-between mb-4">
                <span id="question-counter" class="badge bg-primary"></span>
                <span id="timer" class="badge bg-danger">الوقت: 30 ثانية</span>
            </div>
            
            <div id="question" class="mb-4 fs-5 fw-bold"></div>
            
            <div id="options" class="mb-4"></div>
            
            <button id="next-btn" class="btn btn-primary">التالي</button>
        </div>

        <!-- Results -->
        <div id="results" class="d-none text-center">
            <h2 class="mb-4">نتيجة الاختبار</h2>
            <p id="user-result" class="fs-4"></p>
            <p id="score" class="display-4 fw-bold mb-4"></p>
            <div id="answers-review" class="mb-4"></div>
            <button id="restart-btn" class="btn btn-primary">إعادة الاختبار</button>
        </div>
    </div>

    <!-- Bootstrap & EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
